name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validar Lint, Build e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fliperama-local

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fliperama-local/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar Lint
        run: npm run lint

      - name: Executar Testes Automatizados
        run: npm test

      - name: Validar Build e Tipagem
        run: npm run build

  deploy:
    name: Publicar Deploys (Render + Vercel)
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Disparar Deploy no Render
        if: env.RENDER_HOOK != ''
        run: |
          echo "Disparando deploy no Render..."
          curl -fsS -X POST "$RENDER_HOOK"

      - name: Disparar Deploy na Vercel
        if: env.VERCEL_HOOK != ''
        run: |
          echo "Disparando deploy na Vercel..."
          curl -fsS -X POST "$VERCEL_HOOK"
